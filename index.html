<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Data Integration / ETL</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/integration-hub/integration-hub.html"></iframe>
  <script>
    const routes = {
  "integration-hub": "pages/integration-hub/integration-hub.html",
  "sync-pipelines": "pages/sync-pipelines/sync-pipelines.html",
  "sync-runs": "pages/sync-runs/sync-runs.html",
  "source-connections": "pages/source-connections/source-connections.html",
  "destination-targets": "pages/destination-targets/destination-targets.html",
  "custom-connector-studio": "pages/custom-connector-studio/custom-connector-studio.html",
  "transformation-models": "pages/transformation-models/transformation-models.html",
  "dag-lineage-explorer": "pages/dag-lineage-explorer/dag-lineage-explorer.html",
  "schema-drift-center": "pages/schema-drift-center/schema-drift-center.html",
  "pipeline-detail": "pages/pipeline-detail/pipeline-detail.html",
  "run-attempt-detail": "pages/run-attempt-detail/run-attempt-detail.html",
  "connector-pipeline-drawer": "pages/connector-pipeline-drawer/connector-pipeline-drawer.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'integration-hub';
      const target = routes[route] || routes['integration-hub'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
